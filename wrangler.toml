name = "skybound-academy"
compatibility_date = "2024-01-01"
pages_build_output_dir = "./dist"

# =====================================================
# CLOUDFLARE PAGES DEPLOYMENT STEPS
# =====================================================
#
# Run these commands in order:
#
# 1. npm run build
#    - Builds the React frontend to ./dist folder
#
# 2. npx wrangler d1 create skyboundacademy_db  
#    - Creates a new D1 database (only if you don't have one)
#    - Copy the database_id from output and update below
#
# 3. npx wrangler d1 execute skyboundacademy_db --file=schema.sql --remote
#    - Pushes database schema to Cloudflare D1
#
# 4. npx wrangler pages project create skybound-academy
#    - Creates Cloudflare Pages project (only once)
#
# 5. npx wrangler pages deploy ./dist
#    - Deploys your app to Cloudflare Pages
#
# =====================================================

# D1 Database Configuration
# If you already have a D1 database, update the database_id below
# Get your database ID from: Cloudflare Dashboard > D1 > Your Database

[[d1_databases]]
binding = "DB"
database_name = "skyboundacademy_db"
database_id = "4d391d81-6279-4ded-bad2-74c5e6ad4e97"  # Update if needed

# Environment variables
[vars]
ENVIRONMENT = "production"

# Build configuration
[build]
command = "npm run build"
cwd = "."
